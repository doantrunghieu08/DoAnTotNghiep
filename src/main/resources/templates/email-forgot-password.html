<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">
    <h2 style="color: #1DB954; text-align: center;">Hỗ trợ khôi phục mật khẩu</h2>

    <p>Xin chào <b th:text="${name}">Tên Người Dùng</b>,</p>

    <p>Hệ thống đã nhận được yêu cầu cấp lại mật khẩu cho tài khoản của bạn.</p>
    <div style="background-color: #f8f9fa; padding: 15px; text-align: center; border-radius: 5px; margin: 20px 0;">
        <h3 style="margin: 0; color: #333;">Mật khẩu mới của bạn là:</h3>

        <h1 style="color: #d9534f; margin: 10px 0; letter-spacing: 2px;" th:text="${newPass}">123456</h1>

    </div>
    <p style="color: #555;">Vui lòng đăng nhập lại và đổi mật khẩu ngay để đảm bảo an toàn.</p>
    <p>Trân trọng,<br><b>Đội ngũ phát triển App</b></p>
</div>
</body>
</html>
