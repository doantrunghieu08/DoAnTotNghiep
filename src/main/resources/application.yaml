server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true
  tomcat:
    threads:
      max: 50
      min-spare: 10
    max-connections: 2000
    accept-count: 100

jwt:
  signerKey: ${JWT_SIGNER_KEY:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration: 43200000
  refresh-token-expiration: 604800000

spring:
  data:
    web:
      pageable:
        page-parameter-name: page
        size-parameter-name: size
      page-serialization-mode: via-dto
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  datasource:
    # URL kết nối tới service mysql (mặc định trỏ localhost cho dev, docker tự override)
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kbvaamfl_DoAnTotNgiep?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Doanhieu@1}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        boot:
          allow_jdbc_metadata_access: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:hotro.booingfilmticket@gmail.com}
    password: ${MAIL_PASSWORD:rvsvidqahczqbgep}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: INFO
    org.springframework.orm.jpa: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    org.hibernate.orm.jdbc.connections: DEBUG

