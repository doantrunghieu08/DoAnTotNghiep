server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true

  tomcat:
    threads:
      max: 50         # Tăng số luồng xử lý đồng thời lên 50
      min-spare: 10    # Luôn duy trì ít nhất 10 luồng rảnh rỗi
    max-connections: 2000 # Chấp nhận tối đa 2000 kết nối cùng lúc
    accept-count: 100     # Hàng đợi cho các request chờ xử lý

jwt:
  signerKey: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
  expiration: 43200000 # 15p của access token
  refresh-token-expiration: 604800000 # 7 ngày refresh token


spring:
  data:
    web:
      pageable:
        page-parameter-name: page
        size-parameter-name: size
      # Chuyển Page sang dạng DTO ổn định cho Frontend
      page-serialization-mode: via-dto

  datasource:
    url: jdbc:mysql://localhost:3306/kbvaamfl_DoAnTotNghiep?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: admin # Đặt giống pass docker cho đỡ nhầm

    hikari:
      maximum-pool-size: 30     # Nâng từ 10 (mặc định) lên 50 để tránh chờ kết nối DB
      connection-timeout: 30000  # Chờ tối đa 30s để lấy kết nối
      idle-timeout: 600000
      max-lifetime: 1800000

  servlet:
