services:
  db-doantotnghiep:
    image: mysql:8.0
    container_name: mysql_be
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: Doanhieu@1 # 🔐 Mật khẩu root siêu bảo mật sếp vừa đặt
      MYSQL_DATABASE: kbvaamfl_DoAnTotNgiep

    ports:
      - "127.0.0.1:3306:3306" # 🚨 SỬA Ở ĐÂY: Khóa chặt cổng DB vào localhost của VPS, hacker khóc thét!

    volumes:
      - mysql_data:/var/lib/mysql

  spring-be:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: doantotnghiep_be
    restart: unless-stopped

    depends_on:
      - db-doantotnghiep

    ports:
      - "8080:8080" # 🚨 SỬA Ở ĐÂY: Con Spring Boot phải mở cổng 8080 ra ngoài thì người ta mới gọi API vào web của sếp được chứ!

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-doantotnghiep:3306/kbvaamfl_DoAnTotNgiep?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Doanhieu@1 # 🚨 SỬA Ở ĐÂY: Phải đổi từ 'admin' thành 'Doanhieu@1' cho khớp với mật khẩu của con MySQL ở trên thì Spring Boot mới login vào được sếp nhé!

      JWT_SIGNER_KEY: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437

